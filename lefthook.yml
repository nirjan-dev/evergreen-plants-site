pre-commit:
  jobs:
    - name: lint
      run: pnpm lint {staged_files}
      glob:
        - '*.ts'
        - '*.js'
        - '*.tsx'
        - '*.jsx'
        - '*.json'
        - '*.css'
        - '*.html'
      stage_fixed: true
    - name: typecheck frontend
      run: pnpm typecheck
      glob:
        - '*.ts'
        - '*.js'
        - '*.tsx'
        - '*.jsx'
